[package]
name = "consortium"
version = "0.1.3"
description = "An in-house development studio that drives coding-agent CLIs against a shared workspace."
authors = ["Brett Bazaar"]
edition = "2021"
default-run = "consortium-studio"   # `cargo run` / `tauri dev` mean the GUI

[[bin]]
name = "consortium-studio"   # the Tauri GUI
path = "src/main.rs"

[[bin]]
name = "consortium"          # the CLI the agents call
path = "src/bin/consortium.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] } # devtools: surface a real error instead of a blank window
serde = { version = "1", features = ["derive"] }
serde_json = "1" # agent CLIs speak stream-json; every line off stdout is parsed here
tauri-plugin-updater = "2" # the studio keeps itself up to date
notify = "8.2.0"
uuid = { version = "1", features = ["v5"] } # derived session ids: same room, same agent, same id, forever

# No HTTP client on purpose — Consortium never talks to a model provider itself.
# The agent CLIs own their own auth, transport, and billing; we only drive them.

# Job objects, so an agent process cannot outlive Consortium even if it is
# killed rather than closed. Windows only; macOS keeps the clean-close path.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
