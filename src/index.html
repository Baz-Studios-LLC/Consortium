<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consortium</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #141821;
    --panel-2: #1a1f2b;
    --line: #242c3a;
    --text: #e6e9f0;
    --muted: #8b94a7;
    --accent: #6ea8fe;
    --claude: #d97757;
    --codex: #10a37f;
    --err: #f2777a;
    --ok: #7ec699;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); -webkit-app-region: drag;
  }
  header .brand { font-weight: 650; letter-spacing: .2px; }
  header .ws {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    -webkit-app-region: no-drag;
  }
  .ws-path {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 6px; max-width: 46ch;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- main ---- */
  main { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  aside {
    border-right: 1px solid var(--line); background: var(--panel);
    display: grid; grid-template-rows: auto 1fr; min-height: 0;
  }
  .sec-title {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); padding: 15px 18px 8px;
  }
  .agent {
    display: flex; align-items: center; gap: 9px; margin: 0 8px 6px;
    padding: 9px 10px; border-radius: 8px;
    border: 1px solid transparent;
  }
  .agent:hover { background: var(--panel-2); }
  .agent.sel { background: var(--panel-2); border-color: var(--line); }
  .agent.off { opacity: .45; cursor: not-allowed; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.claude { background: var(--claude); }
  .dot.codex { background: var(--codex); }
  .dot.off { background: var(--muted); }
  .agent { overflow: hidden; }
  .agent .meta { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .agent .nm { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .vr {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agent .spin { margin-left: auto; font-size: 10px; color: var(--accent); }
  .role {
    font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--muted); flex: none; white-space: nowrap;
  }
  .role.primary { color: var(--accent); border-color: #33507e; background: #17213a; }
  .role.swap { cursor: pointer; }
  .role.swap:hover { color: var(--text); border-color: var(--accent); }

  /* briefing modal */
  .scrim {
    position: fixed; inset: 0; background: #000a; display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .scrim.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: min(760px, 88vw); max-height: 82vh; overflow-y: auto; padding: 18px 20px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 15px; }
  .modal .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 14px; }
  .brief-block { margin-bottom: 16px; }
  .brief-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .brief-head .nm { font-weight: 600; font-size: 12.5px; }
  .brief-block textarea {
    width: 100%; min-height: 150px; font-family: var(--mono); font-size: 11.5px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; resize: vertical;
  }

  .files { overflow-y: auto; padding-bottom: 12px; min-height: 0; }
  .file {
    display: flex; gap: 8px; align-items: center;
    padding: 5px 18px; font-family: var(--mono); font-size: 11px;
  }
  .file .sz { margin-left: auto; color: var(--muted); font-size: 10px; }
  .empty { color: var(--muted); padding: 6px 18px; font-size: 11.5px; font-style: italic; }

  /* ---- transcript ---- */
  #log { overflow-y: auto; padding: 18px 22px; min-height: 0; }
  .turn { margin-bottom: 16px; max-width: 900px; }
  .turn .who {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 5px;
  }
  .turn .when { text-transform: none; letter-spacing: 0; opacity: .65; margin-left: 7px; }
  .turn .body {
    white-space: pre-wrap; word-break: break-word;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .turn.you .body { border-left-color: var(--accent); }
  .turn.claude .body { border-left-color: var(--claude); }
  .turn.codex .body { border-left-color: var(--codex); }
  .turn.sys .body, .turn.err .body {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .turn.err .body { color: var(--err); border-left-color: var(--err); }
  .turn.failed .body { border-left-color: var(--err); }
  .seg-room { white-space: pre-wrap; }
  .seg-local {
    white-space: pre-wrap; color: var(--muted); font-size: 12px;
    border-left: 2px dotted var(--line); padding-left: 9px; margin: 6px 0;
  }
  .seg-local::before {
    content: 'local · not shared'; display: block;
    font-size: 9px; letter-spacing: .07em; text-transform: uppercase;
    color: #5d677d; margin-bottom: 3px;
  }
  .chips { margin-top: 6px; }
  .tool {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 5px; margin: 2px 4px 2px 0;
  }
  .result-bar {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 8px;
  }

  /* ---- composer ---- */
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 11px 16px; }
  .row { display: flex; gap: 9px; align-items: stretch; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 190px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px;
    font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #0b1020; border: 0; font: inherit;
    font-weight: 640; padding: 0 22px; border-radius: 9px; cursor: pointer;
  }
  button.ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    font-weight: 500; padding: 6px 11px; border-radius: 7px; font-size: 11.5px;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.stop { background: var(--err); color: #1a0c0c; }
  .hint { color: var(--muted); font-size: 10.5px; margin-top: 7px; }
  .pill {
    display: none; align-items: center; gap: 6px; -webkit-app-region: no-drag;
    background: #1b3326; color: var(--ok); border: 1px solid #2c5740;
    font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .pill.show { display: inline-flex; }
  .pill:hover { background: #21402f; }
  .pill[disabled] { opacity: .6; cursor: default; }
  .opts { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
  .opt-label { color: var(--muted); font-size: 11px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
    font: inherit; font-size: 11.5px; font-weight: 500;
    padding: 4px 11px; border-radius: 7px; cursor: pointer;
  }
  .seg button.on { color: var(--text); border-color: var(--accent); background: #1d2740; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <span class="brand">Consortium</span>
  <span class="hint" id="sub">development studio</span>
  <div class="ws">
    <button class="pill" id="updatePill"></button>
    <span class="ws-path" id="wsPath">…</span>
    <button class="ghost" id="revealBtn">Reveal</button>
    <button class="ghost" id="briefBtn">Briefing</button>
    <button class="ghost" id="refreshBtn">Refresh</button>
  </div>
</header>

<main>
  <aside>
    <div>
      <div class="sec-title">Agents</div>
      <div id="agents"></div>
      <div class="sec-title">Shared workspace</div>
    </div>
    <div class="files" id="files"></div>
  </aside>
  <div id="log"></div>
</main>

<footer>
  <div class="row">
    <textarea id="prompt" placeholder="Message the room…  everyone here sees it  (⌘↵ to send)"></textarea>
    <button id="runBtn">Send</button>
    <button id="stopBtn" class="stop" style="display:none">Stop</button>
  </div>
  <div class="opts">
    <span class="opt-label" id="cliState">Checking for the consortium CLI…</span>
  </div>
  <div class="hint" id="status">Ready.</div>
</footer>

<div class="scrim" id="scrim">
  <div class="modal">
    <h2>Briefing</h2>
    <div class="sub">
      What each agent is told at the start of a session. Copy one to paste straight
      into a Codex or Claude Code session you're driving yourself.
    </div>
    <div id="briefBody"></div>
    <button class="ghost" id="briefClose">Close</button>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);

// Consortium never launches or authenticates an agent. Claude and Codex already
// run in their own apps and talk through the `consortium` CLI; this window is
// simply another participant reading and writing the same log.
const KNOWN = [
  { id: 'claude', name: 'Claude', dot: 'claude', waitSecs: 540 },
  { id: 'codex',  name: 'Codex',  dot: 'codex',  waitSecs: 55  }
];
const ME = 'You';

let agents = KNOWN.slice();
let primary = localStorage.getItem('primary') || 'claude';
let shown = 0;              // how many log lines are already on screen
let seenFrom = new Set();
let presence = {};          // name -> {state, age_secs}

const nameOf = (id) => (KNOWN.find(a => a.id === id) || {}).name || id;
const speakerClass = (from) => {
  const hit = KNOWN.find(a => a.name.toLowerCase() === String(from).toLowerCase());
  return hit ? hit.id : (from === ME ? 'you' : 'sys');
};

// ---------- transcript ----------
const clockOf = (at) =>
  at ? new Date(at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

function renderMessage(m) {
  const el = document.createElement('div');
  el.className = 'turn ' + speakerClass(m.from);
  el.innerHTML = '<div class="who"><span class="nm"></span><span class="when"></span></div>' +
                 '<div class="body"><div class="text"></div></div>';
  el.querySelector('.nm').textContent = m.from;
  el.querySelector('.when').textContent = clockOf(m.at);
  el.querySelector('.text').textContent = m.text;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
}

const agoOf = (s) => s < 45 ? 'just now' : s < 5400 ? Math.round(s / 60) + 'm ago'
                                          : Math.round(s / 3600) + 'h ago';

async function pollPresence() {
  try {
    const rows = await invoke('bus_presence');
    presence = {};
    for (const r of rows) presence[r.who] = r;
    renderParticipants();
  } catch (_) { /* no presence yet */ }
}

async function pollBus() {
  let msgs;
  try { msgs = await invoke('bus_messages'); } catch (_) { return; }
  if (msgs.length < shown) { $('log').innerHTML = ''; shown = 0; }   // log was reset
  for (let i = shown; i < msgs.length; i++) {
    renderMessage(msgs[i]);
    seenFrom.add(msgs[i].from);
  }
  if (msgs.length !== shown) { shown = msgs.length; renderParticipants(); }
}

async function send() {
  const text = $('prompt').value.trim();
  if (!text) return;
  $('prompt').value = '';
  try { await invoke('bus_post', { from: ME, text }); }
  catch (e) { console.error(e); }
  pollBus();
}

// ---------- participants ----------
function renderParticipants() {
  const box = $('agents');
  box.innerHTML = '';
  for (const a of KNOWN) {
    const isPrimary = a.id === primary;
    const p = presence[a.name];
    const joined = seenFrom.has(a.name) || !!p;
    const listening = p && p.state === 'listening';
    const el = document.createElement('div');
    el.className = 'agent' + (listening ? '' : ' off');
    el.innerHTML =
      '<span class="dot ' + (listening ? a.dot : 'off') + '"></span>' +
      '<span class="meta"><div class="nm"></div><div class="vr"></div></span>' +
      '<span class="role' + (isPrimary ? ' primary' : '') + '"></span>';
    el.querySelector('.nm').textContent = a.name;
    // An agent only sees new messages while it is blocked on `wait`. Once its
    // turn ends nothing can reach it, so say that rather than implying presence.
    el.querySelector('.vr').textContent =
      !joined      ? 'not joined yet'
      : listening  ? 'listening · will see new messages'
                   : 'away since ' + agoOf(p ? p.age_secs : 0) + ' · needs a turn';
    el.title = listening
      ? a.name + ' is blocked on `consortium wait` and will pick up your next message.'
      : a.name + ' has finished its turn. Give it a turn in its own app to bring it back.';
    const badge = el.querySelector('.role');
    badge.textContent = isPrimary ? 'primary' : 'alt';
    if (!isPrimary) {
      badge.classList.add('swap');
      badge.title = 'Make ' + a.name + ' the primary';
      badge.onclick = () => {
        primary = a.id;
        localStorage.setItem('primary', primary);
        renderParticipants();
      };
    }
    box.appendChild(el);
  }
}

// ---------- briefing ----------
function briefingFor(agentId) {
  const me = nameOf(agentId);
  const secs = (KNOWN.find(a => a.id === agentId) || {}).waitSecs || 120;
  const peer = nameOf(KNOWN.find(a => a.id !== agentId).id);
  const isPrimary = agentId === primary;

  const role = isPrimary
    ? 'You are the primary here: you own the direction and the final call. Hand ' +
      peer + ' the pieces where a second pair of eyes or parallel work genuinely ' +
      'helps, and say plainly when you disagree with them.'
    : 'You are assisting ' + nameOf(primary) + ', who owns the direction and the ' +
      'final call. Take on what they hand you, and push back when you think they ' +
      'are wrong — you are a colleague, not a rubber stamp.';

  return [
    'You are ' + me + ', working with ' + peer + ' and the user in a shared session called Consortium.',
    '',
    'You each run in your own app. You reach each other through a local command ' +
    'line tool called `consortium`. It contacts no network and needs no login — it ' +
    'only moves messages and files between you on this machine.',
    '',
    'Your name in the room is: ' + me,
    '',
    'Say something to the room:',
    '    consortium post ' + me + ' "your message"',
    '',
    'Read anything you have not seen yet:',
    '    consortium read ' + me,
    '',
    'Block until someone replies:',
    '    consortium wait ' + me + ' --secs ' + secs,
    '',
    'Share a file, list what is shared, or find the shared folder:',
    '    consortium share /path/to/file',
    '    consortium ls',
    '    consortium who',
    '',
    'STAYING REACHABLE — the most important part:',
    'You only exist while you have a turn. The moment your turn ends you stop, ' +
    'and anything posted afterwards will not reach you until the user gives you ' +
    'a new turn. There is no notification that can wake you.',
    '',
    'So do not finish your turn while you are still expecting something. End it ' +
    'by blocking on the room instead:',
    '    consortium wait ' + me + ' --secs ' + secs,
    '',
    secs + ' seconds is about the longest a single command can block in your ' +
    'environment before it is cut off, so that is one wait. It returns the instant ' +
    'someone speaks. Handle what comes back, then wait again — chaining waits back ' +
    'to back is how you stay in the room, and several in a row is correct, not a ' +
    'mistake. Each one costs a single command.',
    '',
    'When you are genuinely finished, `post` a short sign-off first so the others ' +
    'know not to expect a reply, and then stop.',
    '',
    'How to use it well:',
    '- You decide what is worth saying. Your reasoning, tool calls and exploration ' +
    'stay in your own session; nobody sees them. Only `post` when you actually have ' +
    'something for the others — a question, a decision, a disagreement, a handoff, ' +
    'or a result worth knowing.',
    '- After posting something that needs an answer, run `consortium wait ' + me +
    '` so you actually receive the reply instead of moving on.',
    '- Run `consortium read ' + me + '` whenever you want to check for new messages.',
    '- A message is the right size for discussion. For anything bigger — code, ' +
    'drafts, data, images — `consortium share` the file and say in your message ' +
    'which file you wrote.',
    '- Address people by name so it is obvious who you are asking.',
    '',
    role
  ].join('\n');
}

function openBriefing() {
  const box = $('briefBody');
  box.innerHTML = '';
  for (const a of KNOWN) {
    const block = document.createElement('div');
    block.className = 'brief-block';
    block.innerHTML =
      '<div class="brief-head">' +
        '<span class="dot ' + a.dot + '"></span>' +
        '<span class="nm"></span>' +
        '<span class="role' + (a.id === primary ? ' primary' : '') + '"></span>' +
        '<button class="ghost copy" style="margin-left:auto">Copy</button>' +
      '</div><textarea spellcheck="false"></textarea>';
    block.querySelector('.nm').textContent = a.name;
    block.querySelector('.role').textContent = a.id === primary ? 'primary' : 'alt';
    const ta = block.querySelector('textarea');
    ta.value = briefingFor(a.id);
    const btn = block.querySelector('.copy');
    btn.onclick = async () => {
      await navigator.clipboard.writeText(ta.value);
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
    };
    box.appendChild(block);
  }
  $('scrim').classList.add('open');
}

// ---------- workspace ----------
const fmtSize = (n) =>
  n < 1024 ? n + ' B' :
  n < 1048576 ? (n / 1024).toFixed(1) + ' KB' :
  (n / 1048576).toFixed(1) + ' MB';

async function loadWorkspace() {
  $('wsPath').textContent = await invoke('get_workspace');
  const files = await invoke('list_workspace_files');
  const box = $('files');
  box.innerHTML = '';
  if (!files.length) {
    box.innerHTML = '<div class="empty">Empty — shared files land here.</div>';
    return;
  }
  for (const f of files) {
    const el = document.createElement('div');
    el.className = 'file';
    el.innerHTML = '<span></span><span class="sz"></span>';
    el.children[0].textContent = (f.is_dir ? '▸ ' : '  ') + f.name;
    el.children[1].textContent = f.is_dir ? '' : fmtSize(f.size);
    box.appendChild(el);
  }
}

async function checkCli() {
  const path = await invoke('cli_installed');
  $('cliState').textContent = path
    ? 'consortium CLI ready at ' + path
    : 'consortium CLI not on PATH — the agents cannot talk until it is installed';
  $('cliState').style.color = path ? '' : 'var(--err)';
}

// ---------- self-update ----------
let pendingUpdate = null;

async function checkUpdate() {
  try {
    const version = await invoke('update_check');
    pendingUpdate = version;
    const pill = $('updatePill');
    if (version) { pill.textContent = 'Update to ' + version; pill.classList.add('show'); }
    else pill.classList.remove('show');
  } catch (_) { /* offline or no manifest yet — try again later */ }
}

$('updatePill').onclick = async () => {
  if (!pendingUpdate) return;
  const pill = $('updatePill');
  pill.disabled = true;
  pill.textContent = 'Updating…';
  try { await invoke('update_install'); }          // restarts on success
  catch (e) { pill.disabled = false; pill.textContent = 'Update failed — retry'; }
};

// ---------- wiring ----------
$('runBtn').onclick = send;
$('briefBtn').onclick = openBriefing;
$('briefClose').onclick = () => $('scrim').classList.remove('open');
$('scrim').onclick = (e) => { if (e.target === $('scrim')) $('scrim').classList.remove('open'); };
$('revealBtn').onclick = () => invoke('reveal_workspace');
$('refreshBtn').onclick = () => { loadWorkspace(); pollBus(); pollPresence(); checkCli(); };
$('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});

renderParticipants();
checkCli();
loadWorkspace();
pollBus();
pollPresence();
setInterval(pollBus, 1500);              // the agents post whenever they like
setInterval(pollPresence, 3000);
setInterval(loadWorkspace, 4000);
checkUpdate();
setInterval(checkUpdate, 30 * 60 * 1000);
</script>
</body>
</html>
