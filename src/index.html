<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consortium</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #141821;
    --panel-2: #1a1f2b;
    --line: #242c3a;
    --text: #e6e9f0;
    --muted: #8b94a7;
    --accent: #6ea8fe;
    --claude: #d97757;
    --codex: #6ea8fe;
    /* Named rather than borrowed. Your own messages used --accent, which is
       also the focus ring and the primary button, so the two could not be
       changed independently — and changing a speaker's colour should not
       move a button. */
    --you: #10a37f;
    --err: #f2777a;
    --ok: #7ec699;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }

  /* The platform scrollbar is a light widget with stepper arrows, which on a
     dark panel reads as a bright seam down the side of the window. Restyled
     rather than hidden: something has to say the list continues.

     Quiet at rest and legible on approach — the thumb sits at the weight of a
     divider until the pointer is over the thing that scrolls. Sized through a
     transparent border with background-clip so the track stays empty and the
     thumb keeps its inset without a second element. */
  * {
    scrollbar-width: thin;                        /* Firefox, and the standard */
    scrollbar-color: var(--line) transparent;
  }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track,
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  /* Hover on the scrolling element, not the thumb: the thumb is a few pixels
     wide and asking someone to find it before it brightens is a poor trade. */
  :hover::-webkit-scrollbar-thumb { background: #37415a; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #46536f; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:active { background: var(--muted); background-clip: content-box; }
  /* The stepper arrows. Nothing else in this window has them. */
  ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); -webkit-app-region: drag;
  }
  header .brand { font-weight: 650; letter-spacing: .2px; }
  /* Three pieces of text at three sizes. Centring each box separately leaves
     their baselines at three different heights, which is what made the row
     look crooked; grouping them and aligning on the baseline puts the type
     on one line while the group as a whole stays centred against the
     buttons. The .hint margin is meant for stacked hints under a control,
     and has no business in a row. */
  .brandline { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brandline .hint, .brandline .ver { margin: 0; }
  header .ws {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    -webkit-app-region: no-drag;
  }
  .ws-path {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 6px; max-width: 46ch;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- rooms drawer ----
     On the right and over the top, rather than in the rail. Choosing a room
     is occasional — a few times a day — and it was taking permanent space
     from the two things that are read constantly, the agent list and the
     transcript. Over the top rather than beside: pushing the transcript
     sideways would reflow every message to open a menu. */
  /* No backdrop: the drawer sits alongside the room rather than in front of
     it, so the transcript stays readable and clickable while it is open. Its
     border and shadow are enough to separate the two. */
  /* Everything structural comes from .panel; this is only where it sits. */
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 320px; max-width: 86vw; z-index: 50;
    border-left: 1px solid var(--line);
    box-shadow: -20px 0 44px rgba(0,0,0,.5);
    /* 101% so the shadow clears the edge as well as the panel. */
    transform: translateX(101%);
    transition: transform 190ms cubic-bezier(.2,.8,.2,1);
  }
  .drawer.on { transform: none; }
  .drawer .sec-title { margin-top: 0; }
  @media (prefers-reduced-motion: reduce) {
    .drawer { transition: none; }
  }

  /* ---- main ---- */
  main {
    display: grid; grid-template-columns: 260px 1fr; min-height: 0;
    transition: grid-template-columns 160ms ease;
    /* The drawer is positioned against this rather than the window, so both
       panels span exactly the same band: below the header, above the footer.
       Anchored to the viewport it started at the very top and the two sides
       disagreed about where a panel begins. */
    position: relative; overflow: hidden;
  }
  /* Collapsing the track rather than hiding the element: display:none would
     make the transcript jump, where a track can slide. overflow:hidden on the
     aside is what stops its contents spilling while it narrows. */
  body.rail-hidden main { grid-template-columns: 0 1fr; }
  body.rail-hidden .rail { border-right-color: transparent; }
  .ghost.icon {
    padding: 0; width: 30px; font-size: 14px; line-height: 1;
    -webkit-app-region: no-drag;
  }
  @media (prefers-reduced-motion: reduce) {
    main { transition: none; }
  }
  /* ---- side panels ----
     The rail on the left and the rooms drawer on the right are the same
     object in two positions: a titled head that does not scroll, over a body
     that does. Written once, because two near-identical blocks is precisely
     how the two sides come to disagree about padding, or a border, or how
     tall a header is.

     Only what genuinely differs is stated separately: which edge it sits on,
     and whether it floats above the content or holds a column of its own. */
  .panel {
    background: var(--panel);
    display: grid; grid-template-rows: auto 1fr;
    min-height: 0; min-width: 0; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 44px; flex: none; padding: 0 8px 0 18px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted);
  }
  /* 8px here plus 10px on each row is the 18px inset the rail already used,
     so rows on both sides line up with their own headings. */
  .panel-body { padding: 8px 8px 18px; overflow-y: auto; min-height: 0; }

  .rail { border-right: 1px solid var(--line); }
  .sec-title {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); padding: 15px 10px 8px;
  }
  .agent {
    display: flex; align-items: center; gap: 9px; margin: 0 0 6px;
    padding: 9px 10px; border-radius: 8px;
    border: 1px solid transparent;
  }
  .agent:hover { background: var(--panel-2); }
  .agent.sel { background: var(--panel-2); border-color: var(--line); }
  .agent.off { opacity: .45; cursor: not-allowed; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.claude { background: var(--claude); }
  .dot.codex { background: var(--codex); }
  .dot.off { background: var(--muted); }
  .agent { overflow: hidden; }
  .agent .meta { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .agent .nm { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .vr {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agent .spin { margin-left: auto; font-size: 10px; color: var(--accent); }
  .role {
    font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--muted); flex: none; white-space: nowrap;
  }
  .role.primary { color: var(--accent); border-color: #33507e; background: #17213a; }
  .role.swap { cursor: pointer; }
  .role.swap:hover { color: var(--text); border-color: var(--accent); }

  /* briefing modal */
  .scrim {
    position: fixed; inset: 0; background: #000a; display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .scrim.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    width: min(760px, 88vw); max-height: 82vh; overflow-y: auto; padding: 18px 20px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 15px; }
  .brief-head .sub { color: var(--muted); font-size: 10.5px; }
  .bind { margin: 0 0 8px; }
  .bind input {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
    font: inherit; font-size: 12px; outline: none;
  }
  .bind input:focus { border-color: var(--accent); }
  .modal .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 14px; }
  .brief-block { margin-bottom: 16px; }
  .brief-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .brief-head .nm { font-weight: 600; font-size: 12.5px; }
  .brief-block textarea {
    width: 100%; min-height: 150px; font-family: var(--mono); font-size: 11.5px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; resize: vertical;
  }

  /* The panel body is the scroller; a second one nested inside it would
     give the rail two scrollbars and two places to be lost in. */
  .files { padding-bottom: 12px; }
  .file {
    display: flex; gap: 8px; align-items: center; overflow: hidden;
    padding: 5px 10px; font-family: var(--mono); font-size: 11px;
  }
  .file .nm {
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file .sz { flex: none; color: var(--muted); font-size: 10px; }
  .empty { color: var(--muted); padding: 6px 10px; font-size: 11.5px; font-style: italic; }

  /* ---- transcript ---- */
  #log { overflow-y: auto; padding: 18px 22px; min-height: 0; min-width: 0; }
  .turn { margin-bottom: 16px; max-width: 900px; }
  .turn .who {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 5px;
  }
  .turn .when { text-transform: none; letter-spacing: 0; opacity: .65; margin-left: 7px; }
  .turn .body {
    white-space: pre-wrap; word-break: break-word;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .turn.you .body { border-left-color: var(--you); }
  .turn.claude .body { border-left-color: var(--claude); }
  .turn.codex .body { border-left-color: var(--codex); }
  .turn.sys .body, .turn.err .body {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .turn.err .body { color: var(--err); border-left-color: var(--err); }
  .turn.failed .body { border-left-color: var(--err); }
  .seg-room { white-space: pre-wrap; }
  .seg-local {
    white-space: pre-wrap; color: var(--muted); font-size: 12px;
    border-left: 2px dotted var(--line); padding-left: 9px; margin: 6px 0;
  }
  .seg-local::before {
    content: 'local · not shared'; display: block;
    font-size: 9px; letter-spacing: .07em; text-transform: uppercase;
    color: #5d677d; margin-bottom: 3px;
  }
  .chips { margin-top: 6px; }
  .tool {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 5px; margin: 2px 4px 2px 0;
  }
  .result-bar {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 8px;
  }

  /* ---- composer ---- */
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 16px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  /* A textarea is two rows tall by default and was being given room for a
     paragraph nobody was writing. One line, growing as needed. */
  textarea {
    flex: 1; resize: none; min-height: 34px; max-height: 190px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px;
    font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #0b1020; border: 0; font: inherit;
    font-weight: 640; padding: 0 20px; border-radius: 9px; cursor: pointer;
  }
  button.ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    font-weight: 500; padding: 6px 11px; border-radius: 7px; font-size: 11.5px;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.mini {
    background: none; border: none; color: var(--muted); font-size: 13px;
    padding: 0 4px; line-height: 1; cursor: pointer;
  }
  button.mini:hover { color: var(--text); }
  button.ghost.wide { width: 100%; margin-top: 5px; }
  .conv {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 10px;
    border-radius: 7px; cursor: pointer; font-size: 12.5px;
  }
  .conv:hover { background: var(--panel-2); }
  .conv.on { background: var(--panel-2); font-weight: 600; }
  /* The folder is the load-bearing detail, not decoration: it decides where
     agents work and which sessions can be attached. */
  .conv .where {
    color: var(--muted); font-size: 10.5px; margin-left: auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;
  }
  .newconv { display: grid; gap: 6px; padding: 10px 0 2px; }
  /* [hidden] is a user-agent style and loses to any class that sets display,
     so this has to say so itself or the create form never goes away. */
  .newconv[hidden] { display: none; }
  .newconv input, .field-row input, .room-settings select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; font-size: 12px; font-family: inherit;
    width: 100%; box-sizing: border-box;
  }
  .newconv-row, .field-row { display: flex; gap: 5px; }
  .field-row input { min-width: 0; }
  /* The lower half configures the room selected above, which was not visible
     when it was a bare list of controls: a heading naming that room, and
     labels on the fields, is the difference between settings and clutter. */
  /* One gap above the divider, one below it. Three separate rules were each
     adding their own, which is how 18 + 4 + 14 + 15 became a hole. */
  .room-settings { margin-top: 14px; border-top: 1px solid var(--line); }
  .room-settings .sec-title { padding: 12px 10px 4px; }
  .room-settings .field-label:first-of-type { margin-top: 4px; }
  /* One block per agent, because each keeps its own threads and works
     wherever the thread it is continuing was held. Two agents sharing one
     picker was the confusion: it read as a setting for the room when it was
     only ever a setting for Claude. */
  .agent-sec {
    margin-top: 12px; padding: 11px 12px 13px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
  }
  .agent-sec h4 {
    margin: 0 0 8px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted); font-weight: 600;
    display: flex; align-items: center; gap: 7px;
  }
  .agent-sec select { margin-bottom: 6px; }
  .agent-sec .hint { margin-top: 6px; }
  .field-label {
    display: block; font-size: 11px; color: var(--muted);
    padding: 0 2px 4px; margin-top: 10px;
  }
  /* Armed, not alarming: the second click empties the room, and the messages
     are archived rather than destroyed, so this warns without shouting. */
  button.ghost.armed { border-color: var(--warn, #d08770); color: var(--warn, #d08770); }
  .hint { color: var(--muted); font-size: 10.5px; margin-top: 7px; }
  .older {
    color: var(--muted); font-size: 10.5px; text-align: center;
    padding: 8px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 10px;
  }
  /* Quiet by design: worth being able to find, not worth reading every time.
     Monospace so a version number does not reflow as its digits change. */
  .ver {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    -webkit-app-region: no-drag;
  }
  .pill {
    display: none; align-items: center; gap: 6px; -webkit-app-region: no-drag;
    background: #1b3326; color: var(--ok); border: 1px solid #2c5740;
    font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  /* Mid-download reads as in-progress rather than done: an update that is
     still arriving has not yet earned the colour of one that is ready. */
  .pill.working { background: #2b2718; color: #d8c07c; border-color: #4b4227; }
  .pill.show { display: inline-flex; }
  .pill:hover { background: #21402f; }
  .pill[disabled] { opacity: .6; cursor: default; }
  .opts { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
  .opt-label { color: var(--muted); font-size: 11px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
    font: inherit; font-size: 11.5px; font-weight: 500;
    padding: 4px 11px; border-radius: 7px; cursor: pointer;
  }
  .seg button.on { color: var(--text); border-color: var(--accent); background: #1d2740; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <button class="ghost icon" id="sidebarBtn" title="Hide the sidebar" aria-label="Hide the sidebar" aria-expanded="true">☰</button>
  <div class="brandline">
    <span class="brand">Consortium</span>
    <span class="ver" id="appVer" title="Running version"></span>
    <span class="hint" id="sub">development studio</span>
  </div>
  <div class="ws">
    <button class="pill" id="updatePill"></button>
    <span class="ws-path" id="wsPath">…</span>
    <button class="ghost" id="revealBtn">Reveal</button>
    <button class="ghost" id="briefBtn">Briefing</button>
    <button class="ghost" id="clearBtn">Clear</button>
    <button class="ghost" id="refreshBtn">Refresh</button>
    <button class="ghost icon" id="roomsBtn" title="Room" aria-label="Room" aria-expanded="false">☰</button>
  </div>
</header>

<main>
  <aside class="panel rail">
    <div class="panel-head">
      <span>Agents</span>
      <button class="ghost icon" id="railClose" title="Hide the sidebar" aria-label="Hide the sidebar">✕</button>
    </div>
    <div class="panel-body">
      <div id="agents"></div>
      <div class="sec-title">Shared workspace</div>
      <div class="files" id="files"></div>
    </div>
  </aside>
  <div id="log"></div>
    <div class="panel drawer" id="roomsDrawer" role="dialog" aria-label="Rooms" aria-hidden="true">
    <div class="panel-head">
      <span>Room</span>
      <button class="ghost icon" id="roomsClose" title="Close" aria-label="Close">✕</button>
    </div>
  <div class="panel-body">
    <label class="field-label" for="folderPath">Shared folder</label>
    <div class="field-row">
      <input id="folderPath" placeholder="C:\Code\BazMail" spellcheck="false">
      <button class="ghost" id="folderOpen">Open</button>
    </div>
    <div class="hint" id="folderHint"></div>

    <div class="sec-title">Recent</div>
    <div id="recentFolders"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="row">
    <textarea id="prompt" rows="1" placeholder="Message the room…  everyone here sees it  (Enter sends · Shift+Enter for a new line)"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div class="opts" id="opts">
    <span class="opt-label" id="cliState">Checking for the consortium CLI…</span>
    <button class="ghost" id="installCli" style="display:none">Install CLI</button>
  </div>
  <div class="hint" id="status"></div>
</footer>

<div class="scrim" id="scrim">
  <div class="modal">
    <h2>Briefing</h2>
    <div class="sub">
      What each agent is told at the start of a session. Copy one to paste straight
      into a Codex or Claude Code session you're driving yourself.
    </div>
    <div id="briefBody"></div>
    <button class="ghost" id="briefClose">Close</button>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const $ = (id) => document.getElementById(id);

// Consortium never launches or authenticates an agent. Claude and Codex already
// run in their own apps and talk through the `consortium` CLI; this window is
// simply another participant reading and writing the same log.
const KNOWN = [
  { id: 'claude', name: 'Claude', dot: 'claude', waitSecs: 540 },
  { id: 'codex',  name: 'Codex',  dot: 'codex',  waitSecs: 55  }
];
const ME = 'You';

let agents = KNOWN.slice();
let primary = localStorage.getItem('primary') || 'claude';
let shown = 0;              // how many log lines are already on screen
let seenFrom = new Set();
let presence = {};          // name -> {state, age_secs}
let managed = {};           // lowercased name -> {state, detail}, agents we run
let folders = [];           // folders used before, most recent first

const nameOf = (id) => (KNOWN.find(a => a.id === id) || {}).name || id;
const speakerClass = (from) => {
  const hit = KNOWN.find(a => a.name.toLowerCase() === String(from).toLowerCase());
  return hit ? hit.id : (from === ME ? 'you' : 'sys');
};

// ---------- transcript ----------
const clockOf = (at) =>
  at ? new Date(at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

// Builds without touching the document. Appending here and reading
// scrollHeight per message forced a layout each time, which is why a room
// with eight thousand messages took twenty seconds to paint.
function buildMessage(m) {
  const el = document.createElement('div');
  el.className = 'turn ' + speakerClass(m.from);
  el.innerHTML = '<div class="who"><span class="nm"></span><span class="when"></span></div>' +
                 '<div class="body"><div class="text"></div></div>';
  el.querySelector('.nm').textContent = m.from;
  el.querySelector('.when').textContent = clockOf(m.at);
  el.querySelector('.text').textContent = m.text;
  return el;
}

// How much of a long room to paint on arrival. Enough to read back through,
// far short of what makes the window unusable.
const FIRST_PAINT = 300;

function olderMarker(count) {
  const el = document.createElement('div');
  el.className = 'older';
  el.textContent = count + ' earlier messages not shown';
  return el;
}

const agoOf = (s) => s < 45 ? 'just now' : s < 5400 ? Math.round(s / 60) + 'm ago'
                                          : Math.round(s / 3600) + 'h ago';

async function pollPresence() {
  try {
    const rows = await invoke('bus_presence');
    presence = {};
    for (const r of rows) presence[r.who] = r;
  } catch (_) { /* no presence yet */ }

  // Agents Consortium runs report their own state. Empty when none could be
  // started, in which case the presence line above still describes anyone
  // who joined the room by hand.
  try {
    const rows = await invoke('agent_states');
    managed = {};
    for (const r of rows) managed[r.who.toLowerCase()] = r;
  } catch (_) { managed = {}; }

  renderParticipants();
}

const RAIL_KEY = 'consortium.railHidden';
function applyRail(hidden) {
  document.body.classList.toggle('rail-hidden', hidden);
  const btn = $('sidebarBtn');
  btn.setAttribute('aria-expanded', String(!hidden));
  btn.title = hidden ? 'Show the sidebar' : 'Hide the sidebar';
  btn.setAttribute('aria-label', btn.title);
}
function setRail(hidden) {
  localStorage.setItem(RAIL_KEY, String(hidden));
  applyRail(hidden);
}
$('sidebarBtn').onclick = () =>
  setRail(!document.body.classList.contains('rail-hidden'));
// The same gesture the drawer offers. Both panels close from their own head
// as well as from the control that opened them.
$('railClose').onclick = () => setRail(true);
// Applied before first paint of the list so a collapsed sidebar does not
// flash open on every launch.
applyRail(localStorage.getItem(RAIL_KEY) === 'true');

// Shown because updates now apply on their own. Without it, "which version are
// you on" is a question the window cannot answer.
invoke('app_version')
  .then(v => { $('appVer').textContent = 'v' + v; })
  .catch(() => { $('appVer').textContent = ''; });



async function pollBus() {
  let page;
  try { page = await invoke('bus_messages_since', { from: shown }); }
  catch (_) { return; }

  // Shorter than we had already shown means the room was cleared or
  // switched underneath us; start it over rather than appending to a
  // transcript that no longer exists.
  if (page.total < shown) {
    $('log').innerHTML = ''; shown = 0;
    try { page = await invoke('bus_messages_since', { from: 0 }); }
    catch (_) { return; }
  }

  // First paint of a long room: skip the backlog, and say so rather than
  // quietly presenting the tail as the whole conversation.
  let skipped = 0;
  if (shown === 0 && page.total > FIRST_PAINT) {
    skipped = page.total - FIRST_PAINT;
    shown = skipped;
    try { page = await invoke('bus_messages_since', { from: shown }); }
    catch (_) { return; }
  }
  if (!page.messages.length) return;

  // Staying put if the reader has scrolled up to read something.
  const log = $('log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;

  const batch = document.createDocumentFragment();
  if (skipped) batch.appendChild(olderMarker(skipped));
  for (const m of page.messages) {
    batch.appendChild(buildMessage(m));
    seenFrom.add(m.from);
  }
  log.appendChild(batch);
  if (atBottom) log.scrollTop = log.scrollHeight;

  shown = page.total;
  renderParticipants();
}

async function send() {
  const text = $('prompt').value.trim();
  if (!text) return;
  $('prompt').value = '';
  try { await invoke('bus_post', { from: ME, text }); }
  catch (e) { console.error(e); }
  pollBus();
}

// ---------- the room ----------
// A folder is a room. Its chat lives in it, agents woken here work in it, and
// their memory of it is derived from its path — so pointing Consortium at a
// different folder is the whole of switching rooms. Nothing to name, nothing
// to create, nothing to choose a thread for.
async function loadFolders() {
  try {
    folders = await invoke('workspace_recent');
    $('folderHint').textContent = 'Agents woken here work in this folder.';
  } catch (_) { folders = []; }

  // Left alone while being typed in, or a refresh would rewrite the field
  // under the cursor.
  if (document.activeElement !== $('folderPath')) {
    try { $('folderPath').value = await invoke('get_workspace'); } catch (_) {}
  }
  renderFolders();
}

const folderOf = (p) => String(p || '').split(/[\\/]/).filter(Boolean).slice(-1)[0] || p;
const sameFolder = (a, b) =>
  String(a || '').replace(/[\\/]+$/, '').toLowerCase() ===
  String(b || '').replace(/[\\/]+$/, '').toLowerCase();

function renderFolders() {
  const box = $('recentFolders');
  const here = $('folderPath').value;
  box.innerHTML = '';
  for (const f of folders) {
    const el = document.createElement('div');
    el.className = 'conv' + (sameFolder(f, here) ? ' on' : '');
    el.innerHTML = '<span class="nm"></span><span class="where"></span>';
    el.querySelector('.nm').textContent = folderOf(f);
    el.querySelector('.where').textContent = f;
    el.title = f;
    el.onclick = () => openFolder(f);
    box.appendChild(el);
  }
}

async function openFolder(path) {
  if (!path || !path.trim()) return;
  try {
    await invoke('set_workspace', { path: path.trim() });
  } catch (e) {
    $('folderHint').textContent = String(e);
    return;
  }

  // The transcript on screen belongs to the folder being left, so it goes
  // rather than being appended to.
  $('log').innerHTML = ''; shown = 0; seenFrom = new Set();
  await loadFolders();
  loadWorkspace(); pollBus(); pollPresence();
}

$('folderOpen').onclick = () => openFolder($('folderPath').value);
$('folderPath').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); openFolder($('folderPath').value); }
});

// ---------- participants ----------
function renderParticipants() {
  const box = $('agents');
  box.innerHTML = '';
  for (const a of KNOWN) {
    const isPrimary = a.id === primary;
    const p = presence[a.name];
    const m = managed[a.name.toLowerCase()];
    const joined = seenFrom.has(a.name) || !!p || !!m;
    // An agent Consortium started is reachable whenever it is up, so "away"
    // is not a thing that can be true of it.
    const live = m ? (m.state === 'idle' || m.state === 'working')
                   : !!(p && p.state === 'listening');
    const el = document.createElement('div');
    el.className = 'agent' + (live ? '' : ' off');
    el.innerHTML =
      '<span class="dot ' + (live ? a.dot : 'off') + '"></span>' +
      '<span class="meta"><div class="nm"></div><div class="vr"></div></span>' +
      '<span class="role' + (isPrimary ? ' primary' : '') + '"></span>';
    el.querySelector('.nm').textContent = a.name;
    // An agent only sees new messages while it is blocked on `wait`. Once its
    // turn ends nothing can reach it, so say that rather than implying presence.
    el.querySelector('.vr').textContent =
      m          ? ({ idle: 'ready', working: 'working…', starting: 'starting…',
                      error: 'error', offline: 'offline' })[m.state] || m.state
      : !joined  ? 'not joined'
      : live     ? 'listening'
                 : 'away · ' + agoOf(p ? p.age_secs : 0);

    // The error case carries its reason. "Codex is not installed" and
    // "nobody answered" look identical otherwise, and only one is worth
    // doing anything about.
    el.title = m
      ? (m.state === 'error'   ? a.name + ' could not start: ' + (m.detail || 'reason unknown')
        : m.state === 'working' ? a.name + ' is mid-turn. Anything you send queues behind it.'
        : m.state === 'idle'    ? 'Consortium will wake ' + a.name + ' when a message is for it.'
                                : a.name + ' is ' + m.state + '.')
      // Not run by Consortium: these describe an agent someone is driving by
      // hand, which is the only case where reaching it is still its own
      // problem.
      : live
      ? a.name + ' is waiting on the room in its own app and will see your next message.'
      : a.name + ' is not being run by Consortium, and its turn has ended. Give it a turn in its own app.';
    const badge = el.querySelector('.role');
    badge.textContent = isPrimary ? 'primary' : 'alt';
    if (!isPrimary) {
      badge.classList.add('swap');
      badge.title = 'Make ' + a.name + ' the primary';
      badge.onclick = () => {
        primary = a.id;
        localStorage.setItem('primary', primary);
        renderParticipants();
      };
    }
    box.appendChild(el);
  }
}

// ---------- briefing ----------
// Written to be pasted into ANY agent's session, not just the two we know
// about — the room does not care what is on the other end, only that it can run
// the CLI.
//
// Its job changed when Consortium learned to wake agents itself. An agent
// Consortium runs needs none of this: the adapter hands it the message and the
// room around it. This is for an agent you are driving by hand, which is the
// only case left where staying reachable is the agent's own problem.
const HOST_HEARTBEAT = {
  claude:
    'Your host is Claude Code. Run this once:\n' +
    '      /loop 1m Check Consortium: run `consortium read NAME`. If there are new\n' +
    '      messages, respond via `consortium post NAME "..."`. If nothing, stay quiet.\n' +
    'Note that this only fires while the session is idle, so it will not interrupt you\n' +
    'mid-task. Rely on `consortium wait` while you are actively working.',
  codex:
    'Your host is Codex. Create a scheduled automation that runs every minute:\n' +
    '  - Command: consortium read NAME\n' +
    '  - If the output is "(nothing new)", do nothing and stay silent.\n' +
    '  - Otherwise handle what came back and reply with `consortium post NAME "..."`.\n' +
    'Codex automations re-enter after a turn has ended, which is what makes this work.',
  generic:
    'If your host can schedule recurring work — a cron job, a timer, a scheduled\n' +
    'automation — set one up now that runs `consortium read NAME` every minute,\n' +
    'stays silent when the output is "(nothing new)", and replies when it is not.\n' +
    'This is the only thing that brings you back after a turn has ended. If your\n' +
    'host cannot schedule anything, say so in the room so nobody waits on you.'
};

function briefingFor(name, opts) {
  opts = opts || {};
  const host = opts.host || 'generic';
  const waitSecs = opts.waitSecs || 55;
  const others = (opts.peers || []).filter(p => p !== name);
  const peerList = others.length
    ? others.join(', ') + ' and the user'
    : 'the user, and any other agents who join';

  const role =
    opts.role === 'primary'
      ? 'You are the primary here. You own the direction and the final call. Hand work\n' +
        'to the others where a second pair of eyes or parallel effort genuinely helps,\n' +
        'and say plainly when you disagree with them.'
      : opts.role === 'alt'
      ? 'You are assisting, not leading. Take on what you are handed and support the\n' +
        "primary's direction — but push back when you think they are wrong. You are a\n" +
        'colleague, not a rubber stamp. They own the final call.'
      : 'Treat the others as colleagues. Disagree when you disagree, and say so plainly.';

  return [
    'You are ' + name + ', working in a shared room called Consortium alongside ' + peerList + '.',
    '',
    'Everyone here runs in their own app. You reach each other through a local command',
    'line tool called `consortium`. It contacts no network and needs no login — it only',
    'moves messages and files between processes on this machine.',
    '',
    'YOUR NAME IN THE ROOM IS: ' + name,
    'Use it exactly, every time. It is how the others address you and how your unread',
    'cursor is tracked. Using a different name loses your place in the conversation.',
    '',
    'COMMANDS',
    '    consortium post  ' + name + ' "your message"      say something to the room',
    '    consortium read  ' + name + '                      read what you have not seen',
    '    consortium wait  ' + name + ' --secs ' + waitSecs + '            block until someone speaks*',
    '    consortium share /path/to/file        put a file in the shared folder',
    '    consortium ls                         list the shared folder',
    '    consortium who                        print the shared folder path',
    '',
    '* only needed if Consortium is not running you — see STAYING REACHABLE.',
    '',
    'If `post` prints "posted", it posted. It exits non-zero and prints the reason',
    'when a write fails, so you never have to re-send on a suspicion — and re-sending',
    'on a suspicion is how the room ends up with the same message twice.',
    '',
    'ADDRESSING SOMEONE',
    'Put @Name in a message when you need that person to do something or answer',
    'something. Consortium records who each message addresses, so this is structure',
    'rather than decoration, and it is what a reader uses to tell "for you" from',
    '"for the room".',
    '',
    'Do not @ someone merely to agree with them. "@' + (others[0] || 'Name') + ' thanks, that looks right"',
    'reads as a request for action when it is a full stop. Two agreeable agents who',
    'each @ the other are how a room ends up talking to itself with nobody in it.',
    'Acknowledge without the @, or say nothing — silence is a valid contribution.',
    '',
    'STAYING REACHABLE',
    'This depends entirely on who is running you, and the two cases could not be',
    'more different.',
    '',
    'IF CONSORTIUM IS RUNNING YOU, there is nothing to set up. It watches the room',
    'and starts you when a message is for you, handing you that message and the',
    'conversation around it. End your turn whenever you are done; you will be back',
    'when you are needed. Do not poll, and do not schedule anything — a heartbeat',
    'here is a model invocation to discover, almost always, that nothing happened.',
    '',
    'IF YOU ARE BEING DRIVEN BY HAND in your own app, Consortium cannot reach you.',
    'You exist only while you hold a turn: the moment it ends you stop, and anything',
    'posted afterwards cannot reach you. Two habits fix that, and you need both:',
    '',
    '1. Do not end a turn while you are still expecting something. End it by blocking',
    '   on the room instead:',
    '       consortium wait ' + name + ' --secs ' + waitSecs,
    '   It returns the instant anyone speaks. Handle what comes back, then wait again.',
    '   Chaining waits is the intended pattern, not a mistake — each costs one command.',
    '   ' + waitSecs + ' seconds is about the longest a single command can run in your environment;',
    '   if commands are cut off sooner, lower it.',
    '',
    '2. Set up a heartbeat so you can come BACK after your turn ends.',
    '   ' + HOST_HEARTBEAT[host].split('NAME').join(name),
    '',
    'When you are genuinely finished, post a short sign-off so nobody waits on you.',
    '',
    'HOW TO USE THE ROOM WELL',
    '- Say only what is worth saying. Your reasoning, tool calls and exploration stay in',
    '  your own session and nobody sees them. Post when you have a question, a decision,',
    '  a disagreement, a handoff, or a result someone needs.',
    '- Address people by name so it is obvious who you are asking, and @ them when',
    '  you need something from them.',
    '- A message is for discussion; a file is for substance. For code, drafts, data or',
    '  images, `consortium share` the file and say in your message which file you wrote.',
    '- Do not try to launch or invoke another agent. They are already running. Posting is',
    '  how you reach them.',
    '- Reporting that you tried something and it did not break is a real result. Say so',
    '  rather than inventing a finding.',
    '',
    role
  ].join('\n');
}

function briefBlock(name, opts, subtitle) {
  const block = document.createElement('div');
  block.className = 'brief-block';
  block.innerHTML =
    '<div class="brief-head">' +
      '<span class="nm"></span>' +
      '<span class="sub"></span>' +
      '<button class="ghost copy" style="margin-left:auto">Copy</button>' +
    '</div><textarea spellcheck="false"></textarea>';
  block.querySelector('.nm').textContent = name;
  block.querySelector('.sub').textContent = subtitle || '';
  const ta = block.querySelector('textarea');
  ta.value = briefingFor(name, opts);
  const btn = block.querySelector('.copy');
  btn.onclick = async () => {
    await navigator.clipboard.writeText(ta.value);
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
  };
  return block;
}

function openBriefing() {
  const box = $('briefBody');
  box.innerHTML = '';
  const peers = KNOWN.map(a => a.name);

  for (const a of KNOWN) {
    box.appendChild(briefBlock(a.name, {
      host: a.id,
      waitSecs: a.waitSecs,
      peers,
      role: a.id === primary ? 'primary' : 'alt'
    }, a.id === primary ? 'primary · ' + a.name + ' Code' : 'alt'));
  }

  // Anyone else — paste this into any thread, on any host, under any name.
  const custom = document.createElement('div');
  custom.className = 'brief-block';
  custom.innerHTML =
    '<div class="brief-head">' +
      '<span class="nm">Anyone else</span>' +
      '<span class="sub">name it, then copy — works on any host</span>' +
    '</div>' +
    '<div class="bind"><input id="customName" placeholder="Name in the room, e.g. Gemini" /></div>' +
    '<div id="customBlock"></div>';
  box.appendChild(custom);

  const render = () => {
    const name = ($('customName').value || '').trim() || 'Agent';
    const host = $('customName').value.toLowerCase().includes('codex') ? 'codex'
               : $('customName').value.toLowerCase().includes('claude') ? 'claude' : 'generic';
    const slot = $('customBlock');
    slot.innerHTML = '';
    slot.appendChild(briefBlock(name, { host, waitSecs: 55, peers: peers.concat([name]) }, ''));
  };
  $('customName').oninput = render;
  render();

  $('scrim').classList.add('open');
}

async function checkCli() {
  const path = await invoke('cli_installed');
  const btn = $('installCli');

  // Silent when it is fine. A working CLI is the expected state, and a line
  // reporting it sat under every conversation forever saying nothing that
  // changes what anyone does. It speaks up when there is a problem, which is
  // the only time the path is worth reading.
  $('opts').hidden = !!path;
  $('cliState').textContent = path
    ? ''
    : 'consortium CLI not installed. The agents talk by running it, so the room '
      + 'cannot work until it is.';
  $('cliState').style.color = path ? '' : 'var(--err)';
  // The whole system is inert without the CLI, so make fixing it one click.
  btn.style.display = path ? 'none' : '';
}

$('installCli').onclick = async () => {
  const btn = $('installCli');
  btn.disabled = true;
  btn.textContent = 'Installing…';
  try {
    const res = await invoke('install_cli');
    if (res.on_path) {
      // A process inherits PATH when it starts and never sees later changes, so
      // an agent app that was already open cannot find a CLI installed after it
      // launched. Saying so here saves the same confusing round of "it is on my
      // PATH though" that this message used to cause.
      $('opts').hidden = false;
      $('cliState').textContent =
        'consortium CLI installed at ' + res.path +
        ' — if an agent still cannot find it, quit and reopen that agent’s app: ' +
        'a running program keeps the PATH it started with.';
      $('cliState').style.color = '';
      btn.style.display = 'none';
    } else {
      // Installed, but somewhere the agents' shells will not look.
      $('opts').hidden = false;
      $('cliState').textContent =
        'Installed to ' + res.path + ' — but that folder is not on your PATH, so the ' +
        'agents still cannot run it. Add it to your shell profile.';
      $('cliState').style.color = 'var(--err)';
      btn.textContent = 'Installed';
    }
  } catch (e) {
    $('cliState').textContent = 'Install failed: ' + e;
    $('cliState').style.color = 'var(--err)';
    btn.disabled = false;
    btn.textContent = 'Retry install';
  }
};

// ---------- self-update ----------
let pendingUpdate = null;

// Fetched in the background and applied when the window closes, so nothing
// interrupts a conversation and nobody has to click anything. The pill is
// information, not an action.
// Nothing here is clickable. The pill is a statement about what will happen,
// not an action — leaving it live would offer a button that does nothing.
function showPill(text, kind) {
  const pill = $('updatePill');
  pill.textContent = text;
  pill.classList.add('show');
  pill.classList.toggle('working', kind === 'working');
  pill.disabled = true;
  pill.style.cursor = 'default';
}

async function checkUpdate() {
  const pill = $('updatePill');
  try {
    const available = await invoke('update_check');
    if (!available) { pill.classList.remove('show'); return; }

    // Already fetched and waiting for the next close; nothing more to do,
    // and re-downloading it every five minutes would be worse than nothing.
    if (pendingUpdate === available) {
      showPill(pendingUpdate + ' ready — starts next time', 'ready');
      return;
    }

    // Said as soon as it is known. Fetching can take a while on a slow
    // connection, and until it finished the window looked exactly like one
    // with no update at all.
    showPill(available + ' available — downloading…', 'working');

    const staged = await invoke('update_download');
    pendingUpdate = staged;
    if (staged) showPill(staged + ' ready — starts next time', 'ready');
    else pill.classList.remove('show');
  } catch (_) {
    // Offline, or no manifest yet. Anything already staged is still true, so
    // keep saying so; otherwise claim nothing and let the next check try.
    if (pendingUpdate) showPill(pendingUpdate + ' ready — starts next time', 'ready');
    else pill.classList.remove('show');
  }
}

// Transient by nature: it reports what just happened, and an hour later it is
// only clutter claiming to be current.
let statusClear = null;
const status = $('status');
new MutationObserver(() => {
  clearTimeout(statusClear);
  if (status.textContent) statusClear = setTimeout(() => { status.textContent = ''; }, 8000);
}).observe(status, { childList: true, characterData: true, subtree: true });

$('sendBtn').onclick = send;
$('briefBtn').onclick = openBriefing;
$('briefClose').onclick = () => $('scrim').classList.remove('open');
$('scrim').onclick = (e) => { if (e.target === $('scrim')) $('scrim').classList.remove('open'); };
$('revealBtn').onclick = () => invoke('reveal_workspace');
$('refreshBtn').onclick = () => {
  loadWorkspace(); pollBus(); pollPresence(); checkCli(); loadFolders();
};

// Two clicks rather than a dialog. The first says what is about to happen,
// the second does it, and it disarms on its own so a stray click cannot sit
// there loaded. A modal would be heavier than something this reversible
// deserves; a single click would be a trap.
let clearArmed = null;
function disarmClear() {
  clearTimeout(clearArmed);
  clearArmed = null;
  $('clearBtn').textContent = 'Clear';
  $('clearBtn').classList.remove('armed');
  $('clearBtn').title = 'Empty the room. Messages are archived, not deleted.';
}
$('clearBtn').onclick = async () => {
  if (!clearArmed) {
    $('clearBtn').textContent = 'Clear the room?';
    $('clearBtn').classList.add('armed');
    clearArmed = setTimeout(disarmClear, 4000);
    return;
  }
  disarmClear();
  try {
    const where = await invoke('bus_clear');
    $('status').textContent = 'Room cleared. The old messages are in ' + where;
  } catch (e) {
    $('status').textContent = String(e);
  }
  // pollBus already notices the log got shorter and starts the view over.
  pollBus(); pollPresence();
};
disarmClear();
$('prompt').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  // Enter mid-composition is choosing an IME candidate, not sending. Without
  // this guard anyone typing Japanese or Chinese posts half a word every time
  // they pick a character.
  if (e.isComposing) return;
  // Shift-Enter is the newline; Enter sends, as in every other chat window.
  // Cmd/Ctrl-Enter still sends too — that is what this used to be, and keeping
  // the muscle memory costs nothing.
  if (e.shiftKey) return;
  e.preventDefault();
  send();
});

renderParticipants();
checkCli();
loadWorkspace();
pollBus();
pollPresence();
// The OS tells us when the workspace changes, so the room updates the moment
// anyone speaks rather than up to a second and a half later.
//
// Several writes arrive as several events — a single post can produce more than
// one — so this coalesces them into one refresh per burst.
let refreshQueued = null;
listen('workspace-changed', () => {
  if (refreshQueued) return;
  refreshQueued = setTimeout(() => {
    refreshQueued = null;
    pollBus();
    loadWorkspace();
  }, 60);
});

// A slow safety net, not the mechanism. If the watcher could not start — an
// unusual filesystem, a platform without notifications — the room still
// updates, just at the speed it used to.
setInterval(pollBus, 15000);
setInterval(loadWorkspace, 15000);
// Presence is a timestamp going stale rather than a file changing, so nothing
// on disk announces it. This one genuinely has to be a timer.
setInterval(pollPresence, 3000);
checkUpdate();
// Every five minutes, as asked. A check is one small request and costs
// nothing when there is nothing to report.
setInterval(checkUpdate, 5 * 60 * 1000);
</script>
</body>
</html>
